plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.civiclensai'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.civiclensai"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        viewBinding true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    implementation libs.swiperefreshlayout

    // Location & Maps (OpenStreetMap osmdroid)
    implementation libs.osmdroid.android
    implementation libs.play.services.location

    // CameraX
    implementation libs.camerax.core
    implementation libs.camerax.camera2
    implementation libs.camerax.lifecycle
    implementation libs.camerax.view

    // UI Enhancements (Lottie, Shimmer, CircleImageView, SplashScreen)
    implementation libs.lottie
    implementation libs.shimmer
    implementation libs.circleimageview
    implementation libs.core.splashscreen

    // Room Database Offline Storage Engine
    implementation libs.room.runtime
    annotationProcessor libs.room.compiler

    // Image Loading
    implementation libs.glide

    // Background WorkManager Engine
    implementation libs.work.runtime

    // Firebase (optional via BoM)
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.auth
    implementation libs.firebase.firestore
    implementation libs.firebase.storage

    testImplementation libs.junit
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}